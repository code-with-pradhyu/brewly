      <stop offset="0%" stop-color="#F4C27A"/>
      <stop offset="50%" stop-color="#C8893A"/>
      <stop offset="100%" stop-color="#7A4A20"/>
    </linearGradient>
  </defs>

  <!-- Steam -->
  <path d="M34 18C30 13 31 9 35 5"
